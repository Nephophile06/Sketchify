<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchify Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
  <style>
    .flash-message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-size: 0.95em;
    }

    .flash-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .flash-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>

<body>
  <div class="form-card">
    <a href="/" class="logo-link" title="Back to Home">
      <img src="{{ url_for('static', filename='Sketchify.png') }}" alt="Sketchify Logo" class="logo">
    </a>

    <h3>Sign Up</h3>

    <!-- 🔥 Flash message block -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-message flash-{{ category }}">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <!-- 🔥 End Flash message block -->

    <form action="/user_register" method="post">
      <div class="field-group">
        <label for="regName" class="form-label">Full Name <span class="required-star">*</span></label>
        <input type="text" id="regName" name="name" class="form-control" placeholder="e.g. Anika Azad" required autocomplete="name">
      </div>

      <div class="field-group">
        <label for="regUsername" class="form-label">Username <span class="required-star">*</span></label>
        <input type="text" id="regUsername" name="username" class="form-control" placeholder="Choose a username" required autocomplete="username">
      </div>

      <div class="field-group">
        <label for="regGender" class="form-label">Gender <span class="required-star">*</span></label>
        <select id="regGender" name="gender" class="form-select" required>
          <option value="" disabled selected>Select gender</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field-group">
        <label for="regEmail" class="form-label">Email Address <span class="required-star">*</span></label>
        <input type="email" id="regEmail" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="field-group">
        <label for="regPassword" class="form-label">Password <span class="required-star">*</span></label>
        <input type="password" id="regPassword" name="password" class="form-control" placeholder="Create a password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit">Create Account</button>

      <span class="login-redirect-text">
        Already have an account? <a href="/login" class="login-link">Log in</a>
      </span>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
