<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  .navbar.fixed-top {
    background-color: #fdeded !important;
    height: 125px !important;
    padding: 0 45px !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    z-index: 1040;
    box-sizing: border-box !important;
  }
  .brand-logo {
    display: inline-flex;
    align-items: center;
    height: 100%;
    text-decoration: none;
    padding: 0;
    margin: 0;
  }
  .navbar-logo-img {
    height: 110px;
    width: auto;
    max-height: 115px;
    object-fit: contain;
    display: block;
    transition: transform 0.2s ease;
  }
  .navbar-logo-img:hover {
    transform: scale(1.04);
  }
  .search-container {
    background-color: #ffffff;
    border-radius: 50px;
    padding: 6px 10px 6px 18px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
  }
  .search-box {
    border: none;
    outline: none;
    padding: 6px 10px;
    background: transparent;
    width: 230px;
    font-size: 15px;
    color: #3C7A89;
    font-family: 'Comic Neue', cursive, sans-serif;
  }
  .search-box::placeholder {
    color: #8faab0;
  }
  .search-btn {
    background-color: #3C7A89;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .search-btn:hover {
    background-color: #2b5964;
  }
  .cart-icon {
    width: 95px;
    height: 95px;
    object-fit: contain;
    display: block;
    transition: transform 0.2s ease;
  }
  .cart-icon:hover {
    transform: scale(1.06);
  }
  .cart-badge {
    top: 32%;
    left: 68%;
    font-size: 0.75rem;
    padding: 0.25em 0.55em;
    pointer-events: none;
    transition: transform 0.2s ease;
  }
  @keyframes cartBadgeBounce {
    0% { transform: translate(-50%, -50%) scale(1); }
    40% { transform: translate(-50%, -50%) scale(1.6); }
    70% { transform: translate(-50%, -50%) scale(0.9); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes cartIconWiggle {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg) scale(1.08); }
    50% { transform: rotate(10deg) scale(1.08); }
    75% { transform: rotate(-5deg); }
    100% { transform: rotate(0deg); }
  }
  .cart-badge-bounce {
    animation: cartBadgeBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .cart-icon-wiggle {
    animation: cartIconWiggle 0.5s ease;
  }
  .cart-toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background-color: #3c7a89;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 50px;
    box-shadow: 0 10px 25px rgba(60, 122, 137, 0.35);
    font-family: 'Comic Neue', cursive, sans-serif;
    font-size: 15px;
    font-weight: 700;
    z-index: 9999;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .button-55 {
    align-self: center;
    background-color: #fff;
    background-image: none;
    border-radius: 15px 225px 255px 15px 15px 255px 225px 15px;
    border-style: solid;
    border-width: 2px;
    border-color: #41403e;
    box-shadow: rgba(0, 0, 0, .15) 2px 4px 10px -2px;
    box-sizing: border-box;
    color: #41403e;
    cursor: pointer;
    display: inline-block;
    font-family: 'Comic Neue', cursive, sans-serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 22px;
    outline: none;
    padding: 0.45rem 1.25rem;
    text-decoration: none;
    transition: all 200ms ease-in-out;
    user-select: none;
  }
  .button-55:hover {
    box-shadow: rgba(0, 0, 0, .25) 2px 6px 10px -3px;
    transform: translateY(-1px);
    color: #000;
  }
</style>

<nav class="navbar fixed-top">
  <a href="/" class="brand-logo" title="Sketchify Home">
    <img src="{{ url_for('static', filename='Sketchify.png') }}" alt="SKETCHIFY" class="navbar-logo-img" />
  </a>

  <div class="d-flex align-items-center">
    <form action="{{ url_for('user_route.search_products') }}" method="GET" class="me-3 mb-0">
      <div class="search-container">
        <input type="text" class="search-box" placeholder="Type a product name" name="query" />
        <button class="search-btn" type="submit">Search</button>
      </div>
    </form>

    {% if session.get('user') %}
    <span class="me-3 fw-bold text-dark">{{ session['user']['username'] }}</span>
    <a
      href="/user-dashboard"
      class="me-3 text-decoration-none fw-bold"
      style="color: #3c7a89"
      >Profile</a
    >
    <a href="{{ url_for('user_route.logout') }}" class="button-55 me-3" role="button"
      >Logout</a
    >
    {% else %}
    <a href="{{ url_for('user_route.login') }}" class="button-55 me-3" role="button"
      >Login</a
    >
    {% endif %}

    <a href="/cart" class="position-relative d-inline-block" id="navbar-cart-link" title="View Cart">
      <span
        class="position-absolute translate-middle badge rounded-pill bg-danger cart-badge"
        id="navbar-cart-badge"
      >
        {{ session.get('cart')|length if session.get('cart') else 0 }}
      </span>
      <img
        src="{{ url_for('static', filename='cart.svg') }}"
        alt="Cart"
        class="cart-icon"
        id="navbar-cart-icon"
      />
    </a>
  </div>
</nav>

<div id="cart-toast" class="cart-toast">
  <span>🛒</span>
  <span id="cart-toast-msg">Item added to cart!</span>
</div>

<script>
(function() {
  function showCartToast(message) {
    var toast = document.getElementById('cart-toast');
    var msg = document.getElementById('cart-toast-msg');
    if (!toast) return;
    if (msg && message) msg.textContent = message;
    toast.classList.add('show');
    clearTimeout(window.__cartToastTimeout);
    window.__cartToastTimeout = setTimeout(function() {
      toast.classList.remove('show');
    }, 2200);
  }

  function animateCart() {
    var badge = document.getElementById('navbar-cart-badge');
    var icon = document.getElementById('navbar-cart-icon');
    if (badge) {
      badge.classList.remove('cart-badge-bounce');
      void badge.offsetWidth;
      badge.classList.add('cart-badge-bounce');
    }
    if (icon) {
      icon.classList.remove('cart-icon-wiggle');
      void icon.offsetWidth;
      icon.classList.add('cart-icon-wiggle');
    }
  }

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('a[href*="/add-to-cart/"]');
    if (!btn) return;

    e.preventDefault();
    var href = btn.getAttribute('href');
    if (!href) return;

    var originalText = btn.textContent;
    btn.style.pointerEvents = 'none';
    btn.textContent = 'Added! ✓';

    fetch(href, {
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json'
      }
    })
    .then(function(res) {
      if (!res.ok) throw new Error('Network error');
      return res.json();
    })
    .then(function(data) {
      if (data && data.success) {
        var badge = document.getElementById('navbar-cart-badge');
        if (badge && data.cart_count !== undefined) {
          badge.textContent = data.cart_count;
        }
        animateCart();
        showCartToast(data.message || 'Added to cart!');
      } else {
        window.location.href = href;
      }
    })
    .catch(function(err) {
      window.location.href = href;
    })
    .finally(function() {
      setTimeout(function() {
        btn.textContent = originalText;
        btn.style.pointerEvents = '';
      }, 1200);
    });
  });
})();
</script>
