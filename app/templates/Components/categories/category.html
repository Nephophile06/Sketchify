<!DOCTYPE html>
<html>
<head>
    <title>{{ category_name }} Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            padding-top: 145px;
            background-color: #fdeded;
            font-family: 'Comic Neue', cursive, sans-serif;
        }

        /* Slide-in animation (vertical entry) */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    {% include 'Components/navbar.html' %}

    <div class="container my-4">
        <!-- Breadcrumb & Title -->
        <div class="mb-3">
            <p class="text-secondary small mb-1">
                <a href="/" class="text-secondary text-decoration-none">Home</a> &nbsp;/&nbsp; 
                <span class="text-dark fw-bold text-capitalize">{{ category_name.replace('-', ' ') }}</span>
            </p>
            <h2 class="fw-bold text-dark text-capitalize mb-2">{{ category_name.replace('-', ' ') }}</h2>
        </div>

        <!-- Category Filter Chips -->
        {% include 'Components/subnav.html' %}

        <!-- Product Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mt-1">
            {% for product in products %}
            <div class="col">
                <div class="card custom-hover">
                    <img src="{{ product.image }}" alt="{{ product.name }}" />
                    <div class="info">
                        <h3 class="product-name">{{ product.name }}</h3>
                        <p class="product-desc">{{ product.description }}</p>
                        <p class="product-price">Tk. {{ product.price }}</p>
                        <a
                            href="{{ url_for('cart_route.add_to_cart', product_id=product._id) }}"
                            class="btn-add-cart"
                        >
                            Add to Cart
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
