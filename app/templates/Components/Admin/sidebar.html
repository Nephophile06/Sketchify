<style>
    .sidebar {
        height: 100vh;
        min-height: 100vh;
        background: linear-gradient(180deg, #18262f 0%, #111a21 100%);
        color: #ffffff;
        padding: 32px 16px 24px;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .sidebar-header {
        padding: 0 8px 24px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 34px;
    }

    .sidebar-brand-title {
        color: #ffffff;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1.15;
        margin: 0;
    }

    .sidebar-brand-subtext {
        color: #7d93a2;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        display: block;
        margin-top: 5px;
    }

    .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .sidebar-item {
        color: #b5c0c9;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.96rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .sidebar-item i {
        font-size: 1.15rem;
        color: #7b8e9b;
        transition: color 0.2s ease;
    }

    .sidebar-item:hover {
        background-color: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        transform: translateX(3px);
    }

    .sidebar-item:hover i {
        color: #ffffff;
    }

    .sidebar-item.active {
        background-color: #3c7a89;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(60, 122, 137, 0.35);
    }

    .sidebar-item.active i {
        color: #ffffff;
    }

    .sidebar-footer-links {
        margin-top: auto !important;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .sidebar-logout:hover {
        background-color: rgba(220, 53, 69, 0.2) !important;
        color: #ff8591 !important;
    }

    .sidebar-logout:hover i {
        color: #ff8591 !important;
    }
</style>

<!-- Sidebar -->
<nav class="col-md-2 d-none d-md-flex flex-column sidebar">
    <div class="sidebar-header">
        <h4 class="sidebar-brand-title">Admin Panel</h4>
        <span class="sidebar-brand-subtext">Sketchify Store</span>
    </div>

    <div class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-item {% if request.path == '/admin/dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a href="/admin/products-list" class="sidebar-item {% if '/products' in request.path %}active{% endif %}">
            <i class="bi bi-box-seam"></i>
            <span>Products</span>
        </a>
        <a href="/admin/orders-list" class="sidebar-item {% if '/orders' in request.path %}active{% endif %}">
            <i class="bi bi-receipt"></i>
            <span>Orders</span>
        </a>
        <a href="/admin/users-list" class="sidebar-item {% if '/users' in request.path %}active{% endif %}">
            <i class="bi bi-people"></i>
            <span>Users</span>
        </a>
    </div>

    <div class="sidebar-footer-links mt-auto">
        <a href="/" target="_blank" class="sidebar-item sidebar-external" title="Open Storefront in New Tab">
            <i class="bi bi-shop"></i>
            <span>View Live Store</span>
            <i class="bi bi-box-arrow-up-right ms-auto" style="font-size: 0.8rem;"></i>
        </a>
        <a href="/admin-logout" class="sidebar-item sidebar-logout" title="Log Out of Admin">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>
    </div>
</nav>
